spring.application.name=firma-kurierska

# H2 Database
spring.datasource.url=jdbc:h2:mem:firmakurierskadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Konsola H2 w przegladarce
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Wlaczenie ladowania data.sql po stworzeniu tabel
spring.jpa.defer-datasource-initialization=true

# Allow bean definition overriding to avoid conflicts with autoconfigurations
spring.main.allow-bean-definition-overriding=true

# Disable springdoc HATEOAS integration to avoid compatibility issues with current Spring Boot
springdoc.hateoas.enabled=false
